# netlify.toml
[build]
  command = "npm run build"

[build.environment]
  # Pinned to an exact release so builds are reproducible (Netlify installs it
  # with nvm). Node 20 reached end-of-life in April 2026; 22 is the LTS line
  # the project is developed and tested on. Bump deliberately, e.g. to the
  # latest 22.x or 24.x, and rebuild.
  NODE_VERSION = "22.23.4"
